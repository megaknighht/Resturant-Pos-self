<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Kitchen ko</title>
  </head>
  <body>
    <!-- ===================== SIDEBAR ===================== -->
    <!--First side bar-->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M3 2v7c0 1.1.9 2 2 2h1v11M6 2v9M10 2v9M14 2c-2 2-2 5-2 7s1 4 3 4 3-2 3-4-1-9-1-9-1 0-3 2z"
            />
          </svg>
        </div>
        <div>
          <div class="brand-name">Bistro OS</div>
          <div class="brand-sub">Waiter Workspace</div>
        </div>
      </div>

      <div class="nav-section-label">Manage</div>
      <div class="nav">
        <div class="nav-item active" data-page="orders">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M9 2H5a2 2 0 00-2 2v16l4-2 4 2 4-2 4 2V4a2 2 0 00-2-2h-4"
            />
            <path d="M9 7h6M9 11h6M9 15h4" />
          </svg>
          Orders
          <span class="nav-badge">4</span>
        </div>
        <div class="nav-item" data-page="combos">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
          Combo
        </div>
        <div class="nav-item" data-page="employees">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 00-3-3.87" />
            <path d="M16 3.13a4 4 0 010 7.75" />
          </svg>
          Employees
        </div>
        <div class="nav-item" data-page="inventory">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 8l-9-5-9 5v8l9 5 9-5V8z" />
            <path d="M3.3 8.3L12 13l8.7-4.7M12 22V13" />
          </svg>
          Inventory
          <span class="nav-badge">3</span>
        </div>
        <div class="nav-item" data-page="reports">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 3v18h18" />
            <path d="M7 15l4-6 3 3 5-8" />
          </svg>
          Reports
        </div>
      </div>

      <div class="sidebar-bottom">
        <div class="nav-item">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <path d="M9.09 9a3 3 0 015.83 1c0 2-3 2-3 5" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
          Help Center
        </div>
      </div>
    </aside>
    <script src="script.js"></script>
  </body>
</html>
